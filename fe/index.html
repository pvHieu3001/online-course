<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" type="image/x-icon" href="https://wiseowlnews.com/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Wise Owl News | Global News &amp; Insights</title>
    <meta name="title" content="Wise Owl News | Global News &amp; Insights" />
    <meta
      name="keywords"
      content="tài liệu học tập, chia sẻ tài liệu, tài liệu miễn phí, giáo trình, ebook, bài giảng, học online, học liệu Việt Nam"
    />
    <meta name="author" content="Wise Owl News" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Vietnamese" />
    <meta name="revisit-after" content="7 days" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wiseowlnews.com/" />
    <meta property="og:title" content="Wise Owl News | Global News &amp; Insights" />
    <meta
      property="og:description"
      content="Discover global news, profound insights, and learning resources from Wise Owl News."
    />
    <meta property="og:image" content="https://wiseowlnews.com/logo.png" />
    <meta property="og:site_name" content="Wise Owl News" />
    <meta property="og:locale" content="vi_VN" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://wiseowlnews.com/" />
    <meta
      property="twitter:title"
      content="Wise Owl News | Global News &amp; Insights"
    />
    <meta
      property="twitter:description"
      content="Explore global news, profound insights, and learning resources at Wise Owl News."
    />
    <meta property="twitter:image" content="https://wiseowlnews.com/logo.png" />

    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wise Owl News" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://wiseowlnews.com/" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Wise Owl News",
        "url": "https://wiseowlnews.com",
        "logo": "https://wiseowlnews.com/logo.png",
        "description": "Global news, profound insights, and lifelong learning from Wise Owl News.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "VN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "hỗ trợ người dùng"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
